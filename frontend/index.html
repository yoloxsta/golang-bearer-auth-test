<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go REST API Tester</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .logo {
            font-size: 3em;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 5px 15px rgba(102, 126, 234, 0.4));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2em;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1em;
            font-weight: 400;
        }

        .status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 0.85em;
            margin-top: 10px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .status.online {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(16, 185, 129, 0.8); }
        }

        .status.offline {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
            gap: 25px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 1px solid rgba(102, 126, 234, 0.3);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #a78bfa 100%);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(102, 126, 234, 0.4);
            border: 1px solid rgba(102, 126, 234, 0.5);
        }

        .card h2 {
            background: linear-gradient(135deg, #667eea 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 25px;
            font-size: 1.8em;
            font-weight: 700;
            padding-bottom: 15px;
            border-bottom: 3px solid rgba(102, 126, 234, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.95em;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
            background: rgba(15, 23, 42, 0.8);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button span {
            position: relative;
            z-index: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .btn-warning:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.6);
        }

        .btn-info {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-info:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
        }

        .response-box {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #10b981;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Courier New', Monaco, monospace;
            font-size: 0.9em;
            max-height: 450px;
            overflow-y: auto;
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .response-box.error {
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .response-box::-webkit-scrollbar {
            width: 8px;
        }

        .response-box::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .response-box::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 10px;
        }

        .response-box::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.8);
        }

        .method-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 700;
            margin-right: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .method-get { 
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; 
        }
        .method-post { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white; 
        }
        .method-put { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white; 
        }
        .method-patch { 
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white; 
        }
        .method-delete { 
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white; 
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2em;
            }

            .logo {
                font-size: 3.5em;
            }

            .card {
                padding: 20px;
            }
        }

        /* Loading animation */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .loading-skeleton {
            animation: shimmer 2s infinite;
            background: linear-gradient(to right, #f0f0f0 4%, #e0e0e0 25%, #f0f0f0 36%);
            background-size: 1000px 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🚀</div>
            <h1>Go REST API Tester</h1>
            <p class="subtitle">Test all HTTP methods with Bearer Token Authentication</p>
            <span class="status" id="serverStatus">Checking...</span>
        </header>

        <!-- Token Verification Card -->
        <div class="card" style="margin-bottom: 20px; border: 2px solid #667eea;">
            <h2>🔐 Token Verification Test</h2>
            <p style="font-size: 0.95em; color: #94a3b8; margin-bottom: 15px;">
                Test if Bearer token authentication is working correctly
            </p>
            <div class="btn-group">
                <button class="btn-success" onclick="testWithToken()">
                    ✅ Test WITH Token (Should Work)
                </button>
                <button class="btn-danger" onclick="testWithoutToken()">
                    ❌ Test WITHOUT Token (Should Fail)
                </button>
            </div>
            <div id="tokenTestResult" style="margin-top: 15px;"></div>
        </div>

        <div class="grid">
            <!-- User Management -->
            <div class="card">
                <h2>👤 User Management</h2>
                
                <div class="form-group">
                    <label>User ID</label>
                    <input type="number" id="userId" value="1" placeholder="Enter user ID">
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="getUser()">
                        <span class="method-badge method-get">GET</span> Get User
                    </button>
                    <button class="btn-danger" onclick="deleteUser()">
                        <span class="method-badge method-delete">DELETE</span> Delete User
                    </button>
                </div>

                <div id="userResult"></div>
            </div>

            <!-- Create User -->
            <div class="card">
                <h2>➕ Create User</h2>
                
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="createName" placeholder="Enter name">
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="createEmail" placeholder="Enter email">
                </div>
                
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="createUsername" placeholder="Enter username">
                </div>

                <button class="btn-success" onclick="createUser()">
                    <span class="method-badge method-post">POST</span> Create User
                </button>

                <div id="createResult"></div>
            </div>

            <!-- Update User -->
            <div class="card">
                <h2>✏️ Update User</h2>
                
                <div class="form-group">
                    <label>User ID to Update</label>
                    <input type="number" id="updateUserId" value="1">
                </div>
                
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="updateName" placeholder="New name">
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="updateEmail" placeholder="New email">
                </div>
                
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="updateUsername" placeholder="New username">
                </div>

                <div class="btn-group">
                    <button class="btn-warning" onclick="updateUser()">
                        <span class="method-badge method-put">PUT</span> Full Update
                    </button>
                    <button class="btn-info" onclick="patchUser()">
                        <span class="method-badge method-patch">PATCH</span> Partial Update
                    </button>
                </div>

                <div id="updateResult"></div>
            </div>

            <!-- Post Management -->
            <div class="card">
                <h2>📝 Post Management</h2>
                
                <div class="form-group">
                    <label>Post ID</label>
                    <input type="number" id="postId" value="1">
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="getPost()">
                        <span class="method-badge method-get">GET</span> Get Post
                    </button>
                    <button class="btn-danger" onclick="deletePost()">
                        <span class="method-badge method-delete">DELETE</span> Delete Post
                    </button>
                </div>

                <div id="postResult"></div>
            </div>

            <!-- Create Post -->
            <div class="card">
                <h2>📄 Create Post</h2>
                
                <div class="form-group">
                    <label>User ID</label>
                    <input type="number" id="postUserId" value="1">
                </div>
                
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="postTitle" placeholder="Enter post title">
                </div>
                
                <div class="form-group">
                    <label>Body</label>
                    <input type="text" id="postBody" placeholder="Enter post content">
                </div>

                <button class="btn-success" onclick="createPost()">
                    <span class="method-badge method-post">POST</span> Create Post
                </button>

                <div id="createPostResult"></div>
            </div>

            <!-- Update Post -->
            <div class="card">
                <h2>🔄 Update Post</h2>
                
                <div class="form-group">
                    <label>Post ID to Update</label>
                    <input type="number" id="updatePostId" value="1">
                </div>
                
                <div class="form-group">
                    <label>User ID</label>
                    <input type="number" id="updatePostUserId" value="1">
                </div>
                
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="updatePostTitle" placeholder="New title">
                </div>
                
                <div class="form-group">
                    <label>Body</label>
                    <input type="text" id="updatePostBody" placeholder="New content">
                </div>

                <button class="btn-warning" onclick="updatePost()">
                    <span class="method-badge method-put">PUT</span> Update Post
                </button>

                <div id="updatePostResult"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';
        let TOKEN = '';

        // Load token from backend on page load
        window.addEventListener('load', async () => {
            await loadTokenFromBackend();
            checkServerStatus();
        });

        // Fetch token from backend /config endpoint
        async function loadTokenFromBackend() {
            try {
                const response = await fetch(`${API_URL}/config`);
                if (response.ok) {
                    const data = await response.json();
                    TOKEN = data.bearerToken;
                } else {
                    console.error('❌ Failed to load token from backend');
                }
            } catch (error) {
                console.error('❌ Error loading token:', error);
            }
        }

        // Check server status on load
        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    document.getElementById('serverStatus').textContent = '🟢 Server Online';
                    document.getElementById('serverStatus').className = 'status online';
                } else {
                    throw new Error('Server not responding');
                }
            } catch (error) {
                document.getElementById('serverStatus').textContent = '🔴 Server Offline';
                document.getElementById('serverStatus').className = 'status offline';
            }
        }

        // Test WITH token (should succeed)
        async function testWithToken() {
            try {
                const response = await fetch(`${API_URL}/users/1`, {
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`
                    }
                });
                const data = await response.json();
                
                if (response.ok) {
                    displayResponse('tokenTestResult', {
                        status: '✅ SUCCESS',
                        message: 'Bearer token is working correctly!',
                        token: TOKEN,
                        response: data
                    });
                } else {
                    displayResponse('tokenTestResult', {
                        status: '❌ FAILED',
                        message: 'Token authentication failed',
                        error: data
                    }, true);
                }
            } catch (error) {
                displayResponse('tokenTestResult', { error: error.message }, true);
            }
        }

        // Test WITHOUT token (should fail with 401)
        async function testWithoutToken() {
            try {
                const response = await fetch(`${API_URL}/users/1`);
                const data = await response.json();
                
                if (response.status === 401) {
                    displayResponse('tokenTestResult', {
                        status: '✅ CORRECT BEHAVIOR',
                        message: 'Server correctly rejected request without token',
                        httpStatus: response.status,
                        error: data.error
                    });
                } else {
                    displayResponse('tokenTestResult', {
                        status: '⚠️ WARNING',
                        message: 'Server should have rejected this request!',
                        httpStatus: response.status,
                        response: data
                    }, true);
                }
            } catch (error) {
                displayResponse('tokenTestResult', { error: error.message }, true);
            }
        }

        function displayResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            const responseBox = document.createElement('div');
            responseBox.className = `response-box ${isError ? 'error' : ''}`;
            responseBox.textContent = JSON.stringify(data, null, 2);
            element.innerHTML = '';
            element.appendChild(responseBox);
        }

        // User Functions
        async function getUser() {
            const userId = document.getElementById('userId').value;
            try {
                const response = await fetch(`${API_URL}/users/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`
                    }
                });
                const data = await response.json();
                displayResponse('userResult', data, !response.ok);
            } catch (error) {
                displayResponse('userResult', { error: error.message }, true);
            }
        }

        async function createUser() {
            const name = document.getElementById('createName').value;
            const email = document.getElementById('createEmail').value;
            const username = document.getElementById('createUsername').value;

            if (!name || !email || !username) {
                displayResponse('createResult', { error: 'All fields are required' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, username })
                });
                const data = await response.json();
                displayResponse('createResult', data, !response.ok);
                
                if (response.ok) {
                    document.getElementById('createName').value = '';
                    document.getElementById('createEmail').value = '';
                    document.getElementById('createUsername').value = '';
                }
            } catch (error) {
                displayResponse('createResult', { error: error.message }, true);
            }
        }

        async function updateUser() {
            const userId = document.getElementById('updateUserId').value;
            const name = document.getElementById('updateName').value;
            const email = document.getElementById('updateEmail').value;
            const username = document.getElementById('updateUsername').value;

            if (!name || !email || !username) {
                displayResponse('updateResult', { error: 'All fields are required for PUT' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, username })
                });
                const data = await response.json();
                displayResponse('updateResult', data, !response.ok);
            } catch (error) {
                displayResponse('updateResult', { error: error.message }, true);
            }
        }

        async function patchUser() {
            const userId = document.getElementById('updateUserId').value;
            const name = document.getElementById('updateName').value;
            const email = document.getElementById('updateEmail').value;

            const body = {};
            if (name) body.name = name;
            if (email) body.email = email;

            if (Object.keys(body).length === 0) {
                displayResponse('updateResult', { error: 'At least one field required for PATCH' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users/${userId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                displayResponse('updateResult', data, !response.ok);
            } catch (error) {
                displayResponse('updateResult', { error: error.message }, true);
            }
        }

        async function deleteUser() {
            const userId = document.getElementById('userId').value;
            
            if (!confirm(`Are you sure you want to delete user ${userId}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`
                    }
                });
                const data = await response.json();
                displayResponse('userResult', data, !response.ok);
            } catch (error) {
                displayResponse('userResult', { error: error.message }, true);
            }
        }

        // Post Functions
        async function getPost() {
            const postId = document.getElementById('postId').value;
            try {
                const response = await fetch(`${API_URL}/posts/${postId}`, {
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`
                    }
                });
                const data = await response.json();
                displayResponse('postResult', data, !response.ok);
            } catch (error) {
                displayResponse('postResult', { error: error.message }, true);
            }
        }

        async function createPost() {
            const userId = document.getElementById('postUserId').value;
            const title = document.getElementById('postTitle').value;
            const body = document.getElementById('postBody').value;

            if (!title || !body) {
                displayResponse('createPostResult', { error: 'Title and body are required' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/posts`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId: parseInt(userId), title, body })
                });
                const data = await response.json();
                displayResponse('createPostResult', data, !response.ok);
                
                if (response.ok) {
                    document.getElementById('postTitle').value = '';
                    document.getElementById('postBody').value = '';
                }
            } catch (error) {
                displayResponse('createPostResult', { error: error.message }, true);
            }
        }

        async function updatePost() {
            const postId = document.getElementById('updatePostId').value;
            const userId = document.getElementById('updatePostUserId').value;
            const title = document.getElementById('updatePostTitle').value;
            const body = document.getElementById('updatePostBody').value;

            if (!title || !body) {
                displayResponse('updatePostResult', { error: 'Title and body are required' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/posts/${postId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId: parseInt(userId), title, body })
                });
                const data = await response.json();
                displayResponse('updatePostResult', data, !response.ok);
            } catch (error) {
                displayResponse('updatePostResult', { error: error.message }, true);
            }
        }

        async function deletePost() {
            const postId = document.getElementById('postId').value;
            
            if (!confirm(`Are you sure you want to delete post ${postId}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/posts/${postId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`
                    }
                });
                const data = await response.json();
                displayResponse('postResult', data, !response.ok);
            } catch (error) {
                displayResponse('postResult', { error: error.message }, true);
            }
        }
    </script>
</body>
</html>
